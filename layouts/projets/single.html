{{ define "bodyClass" }}project-single{{ end }}

{{ define "main" }}
<article class="project-page">
  <div class="project-header">
    <a href="/projets/" class="project-close">&times;</a>
    <h1 class="project-header-title">{{ .Title }}</h1>
    {{ with .Params.client }}<p class="project-header-sub">Commercial ~ {{ . }}</p>{{ end }}
    <hr class="project-header-sep">
  </div>

  <div class="project-body">
    {{ with .Description }}<p class="project-description">{{ . }}</p>{{ end }}
    {{ .Content }}
  </div>
</article>
{{ end }}
