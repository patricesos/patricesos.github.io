{{ define "main" }}
  <div class="page-content" style="max-width:var(--content-wide)">
    <h1>{{ .Title }}</h1>
    {{ .Content }}

    <div class="project-card-grid">
      {{ range $project := .Pages.ByParam "year" }}
      {{ $cover := $project.Resources.GetMatch $project.Params.cover }}
      <a href="{{ $project.RelPermalink }}" class="project-card">
        {{ with $cover }}
        {{ $thumb := .Fill "600x400" }}
        <div class="project-card-img">
          <img src="{{ $thumb.RelPermalink }}" alt="{{ $project.Title }}" loading="lazy">
        </div>
        {{ end }}
        <span class="project-card-title">{{ $project.Title }}</span>
      </a>
      {{ end }}
    </div>
  </div>
{{ end }}
