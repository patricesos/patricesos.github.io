  <article class="page-content">
    <p class="article-date">{{ .Date.Format "2 janvier 2006" }}</p>
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    <nav class="article-nav">
      {{ with .NextInSection }}
      <a href="{{ .RelPermalink }}" class="nav-prev">&larr; {{ .Title }}</a>
      {{ end }}
      {{ with .PrevInSection }}
      <a href="{{ .RelPermalink }}" class="nav-next">{{ .Title }} &rarr;</a>
      {{ end }}
    </nav>
  </article>
