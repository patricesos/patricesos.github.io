<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "name": "{{ .Site.Title }}",
      "url": "{{ .Site.BaseURL }}",
      "description": "{{ .Site.Params.site.description }}",
      "author": {
        "@type": "Person",
        "name": "{{ .Site.Params.seo.author }}"
      }
    }
    {{ if .IsHome }}
    ,{
      "@type": "WebPage",
      "name": "{{ .Site.Title }}",
      "url": "{{ .Permalink }}",
      "description": "{{ .Site.Params.site.description }}"
    }
    {{ else if and (eq .Section "brainyard") .IsPage }}
    ,{
      "@type": "Article",
      "headline": "{{ .Title }}",
      "url": "{{ .Permalink }}",
      "description": "{{ .Description }}",
      "datePublished": "{{ .Date.Format "2006-01-02" }}",
      "dateModified": "{{ .Lastmod.Format "2006-01-02" }}",
      "author": {
        "@type": "Person",
        "name": "{{ .Site.Params.seo.author }}"
      }
    }
    {{ else if eq .RelPermalink "/a-propos/" }}
    ,{
      "@type": "ProfilePage",
      "url": "{{ .Permalink }}",
      "mainEntity": {
        "@type": "Person",
        "name": "{{ .Site.Params.seo.author }}",
        "description": "{{ .Site.Params.site.description }}",
        "url": "{{ .Permalink }}"
      }
    }
    {{ else if and (eq .Section "projets") .IsPage }}
    ,{
      "@type": "CreativeWork",
      "name": "{{ .Title }}",
      "url": "{{ .Permalink }}",
      "description": "{{ .Description }}",
      "author": {
        "@type": "Person",
        "name": "{{ .Site.Params.seo.author }}"
      }
    }
    {{ else }}
    ,{
      "@type": "WebPage",
      "name": "{{ .Title }}",
      "url": "{{ .Permalink }}"
    }
    {{ end }}
  ]
}
</script>
