<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.site.description }}{{ end }}">
{{ with .Site.Params.seo.author }}<meta name="author" content="{{ . }}">{{ end }}

<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.site.description }}{{ end }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
{{ with .Site.Params.seo.ogSiteName }}<meta property="og:site_name" content="{{ . }}">{{ end }}
{{ with .Site.Params.seo.ogLocale }}<meta property="og:locale" content="{{ . }}">{{ end }}
{{ $ogImage := .Site.Params.seo.ogImage | default "images/avatar.png" }}
<meta property="og:image" content="{{ $ogImage | absURL }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.site.description }}{{ end }}">
<meta name="twitter:image" content="{{ $ogImage | absURL }}">

<link rel="canonical" href="{{ .Permalink }}">
<meta name="generator" content="Hugo">
{{ with resources.Get "css/main.css" | resources.Minify }}
<link rel="stylesheet" href="{{ .RelPermalink }}">
{{ end }}
<link rel="icon" href="{{ .Site.Params.seo.favicon }}" type="{{ .Site.Params.seo.faviconType }}">
