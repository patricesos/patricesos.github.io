{{ define "main" }}
  {{ if ne .Params.showHero false }}
  <div class="home-hero">
    {{ with .Site.Params.hero.logo }}
      <a href="/a-propos/" class="home-hero-logo-link" aria-label="À propos">
        <img src="{{ . }}" alt="{{ $.Site.Params.hero.name }}" class="home-hero-logo {{ with $.Site.Params.hero.logoShape }}{{ . }}{{ end }}">
      </a>
    {{ else }}
      <h1 class="home-hero-name">{{ $.Site.Params.hero.name }}</h1>
    {{ end }}
    <p class="home-hero-tagline">{{ .Site.Params.hero.tagline }}</p>
  </div>
  {{ end }}

  <div class="home-content">
    {{ .Content }}
  </div>
{{ end }}
