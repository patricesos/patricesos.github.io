  <div class="page-content">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    <ul class="article-list">
      {{ range .Pages }}
      <li class="article-item">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 janvier 2006" }}</time>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        {{ with .Description }}
        <p>{{ . }}</p>
        {{ end }}
      </li>
      {{ end }}
    </ul>
  </div>
