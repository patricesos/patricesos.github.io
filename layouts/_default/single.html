{{ define "main" }}
  <div class="page-content">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    {{ if eq .RelPermalink "/a-propos/" }}

      <h2>Contact</h2>
      <p>Pour me contacter : <a href="mailto:{{ . }}">{{ . }}</a></p>
    </section>
    {{ end }}
    {{ end }}
  </div>
{{ end }}
